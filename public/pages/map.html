<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Знайдіть речі та житло поруч з вами на карті Arthings">
    <title>Карта - Arthings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/map.css">
    <link rel="icon" type="image/png" href="/assets/images/logo.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <script src="/assets/js/preloader.js"></script>
</head>

<body>
    <!-- Navigation -->
    

    

    <!-- Map -->
    <main class="map-page">
        <aside class="map-sidebar">
            <div class="map-sidebar-header">
                <div class="map-search-wrapper">
                    <input type="text" id="map-search" class="map-search-input" autocomplete="off"
                        data-i18n-placeholder="f.placeSearch" placeholder="Місто, село або вулиця…" aria-label="Пошук за адресою">
                    <div id="map-suggestions" class="map-suggestions" hidden></div>
                </div>

                <div class="map-actions">
                    <button type="button" id="btn-near-me" class="map-action-btn" data-i18n="f.nearMe">📍 Поруч зі мною</button>
                    <button type="button" id="btn-reset" class="map-action-btn" data-i18n="f.reset">Скинути</button>
                </div>

                <label class="map-toggle">
                    <input type="checkbox" id="search-in-view" checked>
                    Шукати у видимій області карти
                </label>
            </div>

            <div class="map-filters">
                <div class="map-filter-group">
                    <span class="map-filter-label" data-i18n="f.listingType">Тип оголошень</span>
                    <div class="map-chips" id="type-chips">
                        <button type="button" class="map-chip is-active" data-type="" data-i18n="f.all">Усі</button>
                        <button type="button" class="map-chip" data-type="item" data-i18n="f.items">Речі</button>
                        <button type="button" class="map-chip" data-type="housing" data-i18n="f.housing">Житло</button>
                    </div>
                </div>

                <div class="map-filter-group">
                    <label class="map-filter-label" for="filter-category" data-i18n="f.category">Категорія</label>
                    <select id="filter-category" class="map-filter-select">
                        <option value="" data-i18n="f.allCategories">Усі категорії</option>
                    </select>
                </div>

                <div class="map-filter-group">
                    <span class="map-filter-label" data-i18n="f.price">Ціна, ₴</span>
                    <div class="map-filter-row">
                        <input type="number" id="filter-min-price" class="map-filter-input" data-i18n-placeholder="common.from" placeholder="від" min="0">
                        <input type="number" id="filter-max-price" class="map-filter-input" data-i18n-placeholder="common.to" placeholder="до" min="0">
                    </div>
                </div>

                <div class="map-filter-group">
                    <label class="map-filter-label" for="filter-radius" data-i18n="f.distance">Відстань</label>
                    <select id="filter-radius" class="map-filter-select">
                        <option value="" data-i18n="f.anyF">Будь-яка</option>
                        <option value="1" data-i18n="f.km1">До 1 км</option>
                        <option value="3" data-i18n="f.km3">До 3 км</option>
                        <option value="5" data-i18n="f.km5">До 5 км</option>
                        <option value="10" data-i18n="f.km10">До 10 км</option>
                        <option value="25" data-i18n="f.km25">До 25 км</option>
                        <option value="50" data-i18n="f.km50">До 50 км</option>
                    </select>
                    <small id="radius-hint" style="display:block;margin-top:5px;color:#9ca3af;font-size:11.5px;" data-i18n="f.locateFirst">
                        
                        Спочатку визначте своє місцезнаходження
                    </small>
                </div>

                <div class="map-filter-group">
                    <span class="map-filter-label" data-i18n="f.availableBetween">Вільно у період</span>
                    <div class="map-filter-row">
                        <input type="date" id="filter-from" class="map-filter-input" aria-label="Дата початку">
                        <input type="date" id="filter-to" class="map-filter-input" aria-label="Дата завершення">
                    </div>
                </div>

                <div class="map-filter-group">
                    <label class="map-filter-label" for="filter-rating" data-i18n="f.minRating">Мінімальний рейтинг власника</label>
                    <select id="filter-rating" class="map-filter-select">
                        <option value="" data-i18n="f.any">Будь-який</option>
                        <option value="3" data-i18n="f.rating3">3★ і вище</option>
                        <option value="4" data-i18n="f.rating4">4★ і вище</option>
                        <option value="4.5" data-i18n="f.rating45">4.5★ і вище</option>
                    </select>
                </div>

                <div class="map-filter-group" id="housing-filters" hidden>
                    <span class="map-filter-label" data-i18n="f.housingParams">Параметри житла</span>
                    <div class="map-filter-row" style="margin-bottom:8px;">
                        <input type="number" id="filter-min-rooms" class="map-filter-input" data-i18n-placeholder="f.roomsFrom" placeholder="кімнат від" min="0">
                        <input type="number" id="filter-max-rooms" class="map-filter-input" data-i18n-placeholder="common.to" placeholder="до" min="0">
                    </div>
                    <label class="map-checkbox"><input type="checkbox" id="filter-pets"> Можна з тваринами</label>
                    <label class="map-checkbox"><input type="checkbox" id="filter-students"> Підходить студентам</label>
                    <label class="map-checkbox"><input type="checkbox" id="filter-parking"> Є паркінг</label>
                    <label class="map-checkbox"><input type="checkbox" id="filter-internet"> Є інтернет</label>
                </div>

                <div class="map-filter-group">
                    <label class="map-checkbox">
                        <input type="checkbox" id="filter-verified"> Лише перевірені власники
                    </label>
                </div>
            </div>

            <div class="map-results-header">
                <span id="results-count" data-i18n="common.loading2">Завантаження…</span>
            </div>

            <div class="map-results" id="map-results"></div>
        </aside>

        <div class="map-canvas-wrapper">
            <div id="map"></div>
            <div class="map-loading" id="map-loading" hidden data-i18n="common.loading2">Завантаження…</div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/navbar.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/arthings-map.js"></script>
    <script>
        (function () {
            'use strict';

            let arthingsMap;
            let listingType = new URLSearchParams(location.search).get('type') || '';

            const els = {
                loading: document.getElementById('map-loading'),
                results: document.getElementById('map-results'),
                count: document.getElementById('results-count'),
                housingFilters: document.getElementById('housing-filters'),
                radiusHint: document.getElementById('radius-hint'),
                radius: document.getElementById('filter-radius'),
                nearMe: document.getElementById('btn-near-me')
            };

            /** Reads every control into the flat filter object the API expects. */
            function collectFilters() {
                const value = id => {
                    const el = document.getElementById(id);
                    return el && el.value !== '' ? el.value : undefined;
                };
                const checked = id => {
                    const el = document.getElementById(id);
                    return el && el.checked ? 'true' : undefined;
                };

                const filters = {
                    listingType: listingType || undefined,
                    category: value('filter-category'),
                    minPrice: value('filter-min-price'),
                    maxPrice: value('filter-max-price'),
                    minRating: value('filter-rating'),
                    verifiedOwner: checked('filter-verified'),
                    radiusKm: value('filter-radius')
                };

                const from = value('filter-from');
                const to = value('filter-to');
                // The API only applies an availability window when both ends
                // are present, so sending half of one would silently do nothing.
                if (from && to) {
                    filters.availableFrom = from;
                    filters.availableTo = to;
                }

                if (listingType === 'housing') {
                    filters.minRooms = value('filter-min-rooms');
                    filters.maxRooms = value('filter-max-rooms');
                    filters.petsAllowed = checked('filter-pets');
                    filters.studentsAllowed = checked('filter-students');
                    filters.hasParking = checked('filter-parking');
                    filters.hasInternet = checked('filter-internet');
                }

                return filters;
            }

            function setLoading(isLoading) {
                els.loading.hidden = !isLoading;
            }

            function escapeHtml(value) {
                return String(value ?? '')
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            /** Sidebar list mirroring the visible markers. */
            function renderResults(markers) {
                els.count.textContent = markers.length
                    ? `Знайдено: ${markers.length}`
                    : 'Нічого не знайдено';

                if (!markers.length) {
                    els.results.innerHTML =
                        '<div class="map-empty">Немає оголошень у цій області.<br>Спробуйте змінити фільтри або відсунути карту.</div>';
                    return;
                }

                els.results.innerHTML = markers.map(marker => {
                    const image = marker.image
                        ? `<img class="map-result-image" src="${escapeHtml(marker.image)}" alt="" loading="lazy">`
                        : '<div class="map-result-image"></div>';
                    const location = [marker.street, marker.village || marker.city]
                        .filter(Boolean).join(', ');
                    const distance = marker.distanceKm !== null && marker.distanceKm !== undefined
                        ? `<span>📍 ${marker.distanceKm} км</span>` : '';
                    const rating = marker.ownerRatingCount
                        ? `<span>★ ${Number(marker.ownerRating).toFixed(1)}</span>` : '';

                    return `
                        <a class="map-result-card" href="/pages/item.html?id=${encodeURIComponent(marker.id)}"
                           data-lat="${marker.latitude}" data-lng="${marker.longitude}">
                            ${image}
                            <div class="map-result-body">
                                <div class="map-result-title">${escapeHtml(marker.title)}</div>
                                <div class="map-result-price">${escapeHtml(String(marker.price))}₴</div>
                                <div class="map-result-meta">
                                    ${location ? `<span>${escapeHtml(location)}</span>` : ''}
                                    ${rating}${distance}
                                </div>
                            </div>
                        </a>`;
                }).join('');
            }

            async function applyFilters() {
                setLoading(true);
                try {
                    await arthingsMap.setFilters(collectFilters());
                } finally {
                    setLoading(false);
                }
            }

            /** Populates the category dropdown from the server config. */
            async function loadCategories() {
                try {
                    const config = await api.get('/api/config');
                    const select = document.getElementById('filter-category');
                    const isUk = window.i18n ? i18n.getLanguage() === 'uk' : true;

                    for (const category of config.categories || []) {
                        const option = document.createElement('option');
                        option.value = category.id;
                        option.textContent = `${category.icon} ${isUk ? category.nameUk : category.name}`;
                        select.appendChild(option);
                    }
                } catch (error) {
                    console.error('Failed to load categories:', error);
                }
            }

            function bindControls() {
                const debounced = (() => {
                    let timer;
                    return () => {
                        clearTimeout(timer);
                        timer = setTimeout(applyFilters, 300);
                    };
                })();

                [
                    'filter-category', 'filter-min-price', 'filter-max-price', 'filter-rating',
                    'filter-verified', 'filter-from', 'filter-to', 'filter-min-rooms',
                    'filter-max-rooms', 'filter-pets', 'filter-students', 'filter-parking',
                    'filter-internet'
                ].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.addEventListener('change', debounced);
                });

                els.radius.addEventListener('change', () => {
                    if (els.radius.value && !arthingsMap.userLocation) {
                        // A radius is meaningless without an origin.
                        els.nearMe.click();
                        return;
                    }
                    applyFilters();
                });

                // Listing-type chips.
                document.getElementById('type-chips').addEventListener('click', event => {
                    const chip = event.target.closest('[data-type]');
                    if (!chip) return;

                    document.querySelectorAll('#type-chips .map-chip')
                        .forEach(el => el.classList.remove('is-active'));
                    chip.classList.add('is-active');

                    listingType = chip.dataset.type;
                    els.housingFilters.hidden = listingType !== 'housing';
                    applyFilters();
                });

                document.getElementById('search-in-view').addEventListener('change', event => {
                    arthingsMap.setSearchOnMove(event.target.checked);
                    if (event.target.checked) applyFilters();
                });

                els.nearMe.addEventListener('click', async () => {
                    els.nearMe.disabled = true;
                    els.nearMe.textContent = 'Визначаємо…';
                    try {
                        await arthingsMap.locateUser();
                        els.radiusHint.textContent = 'Місцезнаходження визначено';
                        els.nearMe.classList.add('is-active');
                        if (!els.radius.value) els.radius.value = '10';
                        await applyFilters();
                    } catch (error) {
                        els.radiusHint.textContent = error.message;
                    } finally {
                        els.nearMe.disabled = false;
                        els.nearMe.textContent = '📍 Поруч зі мною';
                    }
                });

                document.getElementById('btn-reset').addEventListener('click', () => {
                    document.querySelectorAll('.map-filters input').forEach(input => {
                        if (input.type === 'checkbox') input.checked = false;
                        else input.value = '';
                    });
                    document.querySelectorAll('.map-filters select').forEach(select => {
                        select.value = '';
                    });
                    els.nearMe.classList.remove('is-active');
                    applyFilters();
                });

                // Hovering a result pans the map to it.
                els.results.addEventListener('mouseover', event => {
                    const card = event.target.closest('.map-result-card');
                    if (!card) return;
                    const lat = Number(card.dataset.lat);
                    const lng = Number(card.dataset.lng);
                    if (Number.isFinite(lat) && Number.isFinite(lng)) {
                        arthingsMap.map.panTo([lat, lng], { animate: true, duration: 0.3 });
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', async () => {
                if (typeof checkAuth === 'function') checkAuth();

                arthingsMap = new ArthingsMap({
                    container: 'map',
                    endpoint: '/api/products/map',
                    onResults: renderResults,
                    onError: () => {
                        els.count.textContent = 'Помилка завантаження';
                        els.results.innerHTML =
                            '<div class="map-empty">Не вдалося завантажити оголошення.</div>';
                    }
                });

                attachMapAutocomplete({
                    input: document.getElementById('map-search'),
                    resultsContainer: document.getElementById('map-suggestions'),
                    onSelect: suggestion => {
                        // fitBounds/flyTo fires moveend, which re-queries.
                        arthingsMap.goToSuggestion(suggestion);
                    }
                });

                // Preselect the housing view when arriving from the housing nav.
                if (listingType) {
                    const chip = document.querySelector(`#type-chips [data-type="${listingType}"]`);
                    if (chip) {
                        document.querySelectorAll('#type-chips .map-chip')
                            .forEach(el => el.classList.remove('is-active'));
                        chip.classList.add('is-active');
                    }
                    els.housingFilters.hidden = listingType !== 'housing';
                }

                bindControls();
                await loadCategories();
                await applyFilters();
            });
        })();
    </script>
</body>

</html>
